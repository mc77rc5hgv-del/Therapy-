[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S"]
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
# tests/*.py use deliberately compact, hand-rolled mock classes and bare `assert` as their only
# check mechanism (no pytest) — same convention as vmeda-biology-bot's tests/.
"tests/*.py" = ["E401", "E701", "E702", "S101"]
# tests/run_all.py shells out to `python3 <fixed local test file path>` for each test file it
# discovers itself — not attacker-controlled input.
"tests/run_all.py" = ["S603"]
